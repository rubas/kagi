version: "3"

tasks:
  setup:tools:
    desc: Install cargo-side QA tools
    cmds:
      - cargo install cargo-machete cargo-deny

  fmt:
    desc: Format Rust and repo config files
    cmds:
      - cargo fmt
      - npx dprint fmt

  fmt:check:
    desc: Check formatting
    cmds:
      - cargo fmt --check
      - npx dprint check

  lint:
    desc: Run Rust lints
    deps: [test:zizmor]
    cmds:
      - cargo clippy --all-targets -- -D warnings

  test:zizmor:
    desc: Lint GitHub Actions workflows for security issues
    cmds:
      - zizmor --offline --persona=pedantic .github/workflows

  test:
    desc: Run the test suite
    cmds:
      - cargo test

  test:live:
    desc: Run live integration tests against Kagi using env or XDG token config
    cmds:
      - |
        token_file="${XDG_CONFIG_HOME:-$HOME/.config}/kagi/session-token"
        if [ -z "${KAGI_SESSION_TOKEN:-}" ] && [ ! -s "$token_file" ]; then
          echo "task test:live requires KAGI_SESSION_TOKEN or $token_file" >&2
          exit 1
        fi
      - cargo test --test live -- --ignored --nocapture

  test:live:advisory:
    desc: Run live integration tests but do not fail the task on test errors
    cmds:
      - |
        token_file="${XDG_CONFIG_HOME:-$HOME/.config}/kagi/session-token"
        if [ -z "${KAGI_SESSION_TOKEN:-}" ] && [ ! -s "$token_file" ]; then
          echo "no live token source found; skipping advisory live test"
          exit 0
        fi
        if ! cargo test --test live -- --ignored --nocapture; then
          echo "live integration test reported failures; advisory task returning success"
        fi

  test:release-check:
    desc: Verify release-profile compilation
    cmds:
      - cargo check --release

  test:nix:
    desc: Build the default Nix package
    cmds:
      - nix build .# --no-link

  deps:machete:
    desc: Check for unused dependencies
    cmds:
      - cargo machete

  deps:deny:
    desc: Run dependency policy checks without license enforcement
    cmds:
      - cargo deny check advisories bans sources

  outdated:
    desc: Show available dependency upgrades without changing anything
    cmds:
      - cargo upgrade --dry-run --incompatible allow

  upgrade:
    desc: Upgrade Cargo dependencies to the latest versions, then refresh the lockfile
    cmds:
      - cargo upgrade --incompatible allow
      - cargo update

  check:
    desc: Run all verification checks
    cmds:
      - task fmt:check
      - task lint
      - task test

  ci:
    desc: Full CI entrypoint
    cmds:
      - task fmt:check
      - task lint
      - task test
      - task test:release-check
      - task test:nix
      - task deps:machete
      - task deps:deny

  build:
    desc: Build the release binary
    cmds:
      - cargo build --release

  install:
    desc: Install the local build with install.sh, in the same layout as a release (Linux x86_64 and macOS aarch64 only)
    vars:
      ROOT: '{{if eq OS "darwin"}}kagi-macos-aarch64{{else}}kagi-linux-x86_64{{end}}'
    cmds:
      - cargo build --release
      - rm -rf target/dist
      - mkdir -p target/dist/{{.ROOT}}/bin target/dist/{{.ROOT}}/skills/kagi
      - cp target/release/kagi-search target/release/kagi-maps target/release/kagi-summarize target/dist/{{.ROOT}}/bin/
      - cp skills/kagi/SKILL.md target/dist/{{.ROOT}}/skills/kagi/
      - tar -czf target/dist/{{.ROOT}}.tar.gz -C target/dist {{.ROOT}}
      - KAGI_INSTALL_BASE_URL="file://$PWD/target/dist" KAGI_INSTALL_VERIFY=skip sh install.sh --force "v$(target/release/kagi-search --version | cut -d' ' -f2)"
