version: "3"

tasks:
  setup:tools:
    desc: Install cargo-side QA tools
    cmds:
      - cargo install cargo-machete cargo-deny

  fmt:
    desc: Format Rust and repo config files
    cmds:
      - cargo fmt
      - npx dprint fmt

  fmt:check:
    desc: Check formatting
    cmds:
      - cargo fmt --check
      - npx dprint check

  lint:
    desc: Run Rust lints
    deps: [test:zizmor]
    cmds:
      - cargo clippy --all-targets -- -D warnings

  test:zizmor:
    desc: Lint GitHub Actions workflows for security issues
    cmds:
      - zizmor --offline --persona=pedantic .github/workflows

  test:
    desc: Run the test suite
    cmds:
      - cargo test

  test:live:
    desc: Run live integration tests against Kagi using env or XDG token config
    cmds:
      - cargo test --test live -- --ignored --nocapture

  test:release-check:
    desc: Verify release-profile compilation
    cmds:
      - cargo check --release

  deps:machete:
    desc: Check for unused dependencies
    cmds:
      - cargo machete

  deps:deny:
    desc: Run dependency policy checks without license enforcement
    cmds:
      - cargo deny check advisories bans sources

  outdated:
    desc: Show available dependency upgrades without changing anything
    cmds:
      - cargo upgrade --dry-run --incompatible allow

  upgrade:
    desc: Upgrade Cargo dependencies to the latest versions, then refresh the lockfile
    cmds:
      - cargo upgrade --incompatible allow
      - cargo update

  check:
    desc: Run all verification checks
    cmds:
      - task fmt:check
      - task lint
      - task test

  ci:
    desc: Full CI entrypoint
    cmds:
      - task fmt:check
      - task lint
      - task test
      - task test:release-check
      - task deps:machete
      - task deps:deny

  build:
    desc: Build the release binary
    cmds:
      - cargo build --release
