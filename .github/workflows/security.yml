# Stub: the audit lives in rubas/ci and updates centrally.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    permissions:
      contents: read # checkout source
      issues: write # the single security tracking issue
    # Same-owner reusable workflow; @main is the design, edits there reach
    # every repo without a sync run. zizmor only honors the trailing ignore.
    uses: rubas/ci/.github/workflows/security.yml@main # zizmor: ignore[unpinned-uses]
