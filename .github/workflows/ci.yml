name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly advisory sweep so new RUSTSEC advisories against the merged
    # lockfile surface between commits.
    - cron: "17 6 * * 1"

permissions: {}

jobs:
  checks:
    name: Checks
    if: github.event_name == 'push' || github.event.pull_request.user.login == github.repository_owner
    runs-on: incus
    permissions:
      contents: read # checkout source
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-checks
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build tools
        run: |
          sudo=""
          [ "$(id -u)" -eq 0 ] || sudo=sudo
          $sudo apt-get -o DPkg::Lock::Timeout=180 update -qq
          $sudo apt-get -o DPkg::Lock::Timeout=180 install -y --no-install-recommends cmake libclang-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        # zizmor: ignore[superfluous-actions] toolchain pinned deliberately
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-machete,cargo-deny
      # Set only after the install steps: they write rustup, its proxies, and
      # the tools into $CARGO_HOME/bin with no lock across pods, and a shared
      # bin failed a concurrent job with "Text file busy" (rubas/babel,
      # 2026-09-22). So those stay in the pod's ~/.cargo, and the shared home
      # holds only cargo's registry and git caches, which cargo locks itself.
      # v2 leaves the old home's stale binaries behind, which cargo would find
      # first.
      - name: Cache paths
        run: |
          repo="${GITHUB_REPOSITORY//\//__}"
          mkdir -p "/ci/$repo/cargo-home-v2"
          touch "/ci/$repo/cargo-home-v2" # mark last-used for the prune timer
          echo "CARGO_HOME=/ci/$repo/cargo-home-v2" >> "$GITHUB_ENV"

      # The target dir is private to this pod. A shared one let cargo reuse
      # another branch's build of this crate (rubas/babel#698): cargo judges a
      # path crate fresh by mtime alone, and every pod checks out to the same
      # path. The warm part is the build main publishes with ci-cache. The
      # touch makes these sources newer than anything in the copy, so the
      # crate itself always rebuilds. Main builds from empty instead, so the
      # copy it publishes holds only its current build and never grows.
      - name: Restore main's build
        if: github.event_name != 'push'
        run: |
          ci-cache restore cargo-target target || echo "no build from main yet, building cold"
          git ls-files -z | xargs -0 touch

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
      # task and zizmor come with the incus runner image.
      - run: task fmt:check
      - run: task lint
      - run: shellcheck install.sh
      - run: task test
      - run: task test:release-check
      - run: task deps:machete
      - run: task deps:deny

      # Only main publishes, so no PR can feed its build to another job.
      - name: Publish the build
        if: github.event_name == 'push'
        run: ci-cache save cargo-target target

  audit:
    name: Advisory audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout source
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-audit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        # zizmor: ignore[superfluous-actions] toolchain pinned deliberately
        with:
          toolchain: stable
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      - run: cargo install cargo-deny
      - run: task deps:deny
