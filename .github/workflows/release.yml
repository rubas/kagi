name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag such as v0.1.0
        required: false
        type: string
      ref:
        description: Git ref to build from, usually refs/tags/vX.Y.Z for recovery runs
        required: false
        default: main
        type: string

permissions: {}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout source and read tags
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-prepare
      cancel-in-progress: false
    outputs:
      should_release: ${{ steps.prepare.outputs.should_release }}
      create_tag: ${{ steps.prepare.outputs.create_tag }}
      tag: ${{ steps.prepare.outputs.tag }}
      ref: ${{ steps.prepare.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: prepare
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)"

          if [ -z "$current_version" ]; then
            echo "::error::no version in Cargo.toml"
            exit 1
          fi

          # The tag decides, not the parent commit: a push whose tip is not the
          # bump, or a push after a cancelled run, still releases.
          if git rev-parse -q --verify "refs/tags/v$current_version" >/dev/null; then
            echo "tag v$current_version exists; release skipped"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$current_version" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/v$current_version" >> "$GITHUB_OUTPUT"

  tag:
    name: Tag
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.create_tag == 'true'
    permissions:
      contents: write # push the release tag
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # zizmor: ignore[artipacked] credentials required to push the release tag
        with:
          fetch-depth: 0
      - name: Create and push release tag
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "$TAG"
          git push origin "$TAG"

  build:
    name: Build
    needs: [prepare, tag]
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.should_release == 'true' }}
    permissions:
      contents: read # checkout source to build release archives
      id-token: write # sign build provenance attestations
      attestations: write # store build provenance attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: kagi-linux-x86_64.tar.gz
            staging: kagi-linux-x86_64
          - os: macos-latest
            archive: kagi-macos-aarch64.tar.gz
            staging: kagi-macos-aarch64
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-${{ matrix.os }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        # zizmor: ignore[superfluous-actions] toolchain pinned deliberately
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release
      - name: Package release archive
        env:
          STAGING: ${{ matrix.staging }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p "$STAGING/bin" "$STAGING/skills/kagi"
          cp target/release/kagi-search "$STAGING/bin/"
          cp target/release/kagi-maps "$STAGING/bin/"
          cp target/release/kagi-summarize "$STAGING/bin/"
          cp skills/kagi/SKILL.md "$STAGING/skills/kagi/SKILL.md"
          tar -czf "$ARCHIVE" "$STAGING"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.archive }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  installer:
    name: Installer
    needs: [prepare, tag]
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout source to upload install.sh
      id-token: write # sign build provenance attestations
      attestations: write # store build provenance attestations
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-installer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: install.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install.sh
          path: install.sh

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [prepare, build, installer]
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.should_release == 'true' }}
    permissions:
      contents: write # publish the GitHub release
      attestations: read # smoke test verifies the attestations of the built archive and install.sh
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Smoke-test install.sh against built artifacts
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/install.sh --repo "$GITHUB_REPOSITORY"
          home="$(mktemp -d)"
          dist="file://$PWD/dist"
          kagi_install() { HOME="$home" KAGI_INSTALL_BASE_URL="$dist" sh dist/install.sh "$@"; }
          snapshot() { find "$home" -printf '%i %T@ %p %l\n' | sort; }

          # Agent roots that exist get a link; the real skill copy of an older
          # installer and a v0.4 per-binary skill dir go away.
          mkdir -p "$home/.claude/skills/kagi" "$home/.codex" "$home/.gemini/antigravity-cli" \
            "$home/.agents/skills/kagi-search"
          status=0
          kagi_install --check "$TAG" || status=$?
          test "$status" -eq 100

          kagi_install "$TAG"
          test -x "$home/.local/bin/kagi-search"
          test -x "$home/.local/bin/kagi-maps"
          test -x "$home/.local/bin/kagi-summarize"
          test -f "$home/.agents/skills/kagi/SKILL.md"
          test ! -e "$home/.agents/skills/kagi-search"
          test "$(readlink "$home/.claude/skills/kagi")" = ../../.agents/skills/kagi
          test "$(readlink "$home/.codex/skills/kagi")" = ../../.agents/skills/kagi
          test "$(readlink "$home/.gemini/antigravity-cli/skills/kagi")" = ../../../.agents/skills/kagi
          test -f "$home/.claude/skills/kagi/SKILL.md"
          test ! -e "$home/.pi"

          # A second run finds the current version and changes nothing.
          before="$(snapshot)"
          kagi_install "$TAG" | grep -Fx "kagi ${TAG#v} is current"
          test "$before" = "$(snapshot)"
          kagi_install --check "$TAG"

          # A symlinked config root gets the link realpath gives. A skills dir
          # that links to the source dir keeps the real skill.
          home="$(mktemp -d)"
          mkdir -p "$home/dots/claude" "$home/.agents/skills" "$home/.codex"
          ln -s dots/claude "$home/.claude"
          ln -s ../.agents/skills "$home/.codex/skills"
          kagi_install "$TAG"
          test "$(readlink "$home/.claude/skills/kagi")" = ../../../.agents/skills/kagi
          test -f "$home/.claude/skills/kagi/SKILL.md"
          test ! -L "$home/.agents/skills/kagi"
          test -f "$home/.codex/skills/kagi/SKILL.md"
      - name: Write release notes
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cp .github/release-notes.md release-notes.md
          sed -i "s|__VERSION__|${TAG}|g" release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        # zizmor: ignore[superfluous-actions] pinned action kept for multi-asset release upload
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/kagi-linux-x86_64.tar.gz
            dist/kagi-macos-aarch64.tar.gz
            dist/install.sh
